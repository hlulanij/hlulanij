<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1f2a44" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="240" height="240" rx="12" fill="#0d1117"/>
  <rect width="240" height="240" rx="12" fill="url(#grid)" opacity="0.7"/>
  <circle cx="120" cy="120" r="105" fill="url(#glow)"/>

  <!-- circuit traces -->
  <g stroke="url(#g)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M85 95H50V60H20"/><path d="M85 120H15"/><path d="M85 145H50V180H20"/>
    <path d="M155 95H190V60H220"/><path d="M155 120H225"/><path d="M155 145H190V180H220"/>
    <path d="M100 85V50H70V20"/><path d="M120 85V15"/><path d="M140 85V50H170V20"/>
    <path d="M100 155V190H70V220"/><path d="M120 155V225"/><path d="M140 155V190H170V220"/>
  </g>
  <g fill="#0d1117" stroke="#58a6ff" stroke-width="2">
    <circle cx="20" cy="60" r="4"/><circle cx="15" cy="120" r="4"/><circle cx="20" cy="180" r="4"/>
    <circle cx="220" cy="60" r="4"/><circle cx="225" cy="120" r="4"/><circle cx="220" cy="180" r="4"/>
    <circle cx="70" cy="20" r="4"/><circle cx="120" cy="15" r="4"/><circle cx="170" cy="20" r="4"/>
    <circle cx="70" cy="220" r="4"/><circle cx="120" cy="225" r="4"/><circle cx="170" cy="220" r="4"/>
  </g>

  <!-- chip -->
  <rect x="80" y="80" width="80" height="80" rx="12" fill="#101a2e" stroke="url(#g)" stroke-width="3"/>
  <rect x="92" y="92" width="56" height="56" rx="6" fill="none" stroke="#58a6ff" stroke-opacity="0.4"/>
  <text x="120" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="url(#g)">AI</text>
</svg>
