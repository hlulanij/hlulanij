<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1f2a44" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="14" fill="url(#grid)" opacity="0.6"/>

  <!-- neural network motif -->
  <g stroke="#58a6ff" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="80" y1="70" x2="150" y2="50"/><line x1="80" y1="70" x2="150" y2="130"/><line x1="80" y1="70" x2="150" y2="210"/>
    <line x1="80" y1="130" x2="150" y2="50"/><line x1="80" y1="130" x2="150" y2="130"/><line x1="80" y1="130" x2="150" y2="210"/>
    <line x1="80" y1="190" x2="150" y2="50"/><line x1="80" y1="190" x2="150" y2="130"/><line x1="80" y1="190" x2="150" y2="210"/>
    <line x1="150" y1="50" x2="220" y2="90"/><line x1="150" y1="130" x2="220" y2="90"/><line x1="150" y1="210" x2="220" y2="90"/>
    <line x1="150" y1="50" x2="220" y2="170"/><line x1="150" y1="130" x2="220" y2="170"/><line x1="150" y1="210" x2="220" y2="170"/>
  </g>
  <g fill="#0d1117" stroke="url(#accent)" stroke-width="2">
    <circle cx="80" cy="70" r="9"/><circle cx="80" cy="130" r="9"/><circle cx="80" cy="190" r="9"/>
    <circle cx="150" cy="50" r="9"/><circle cx="150" cy="130" r="9"/><circle cx="150" cy="210" r="9"/>
    <circle cx="220" cy="90" r="9"/><circle cx="220" cy="170" r="9"/>
  </g>

  <text x="290" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#accent)">Hlulani Mathebula</text>
  <text x="292" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#e6edf3">AI Engineer</text>
  <text x="292" y="200" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8b949e">AI Agents  |  Azure AI  |  Knowledge Retrieval  |  Automation  |  Data Pipelines</text>
</svg>
