# Builds an installable Android APK (demo mode, simulated data) and publishes it as a GitHub Release.
# Download link: https://github.com/hlulanij/hlulanij/releases/tag/preview
name: Build Android preview APK
on:
  push:
    branches: [claude/trusting-turing-2xgi7q]
    paths: ['dropship-app/mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dropship-app/mobile
    env:
      EXPO_PUBLIC_DEMO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dropship-app/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx3g
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk dropit-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dropit-preview-apk
          path: dropship-app/mobile/dropit-preview.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: DropIt preview (Android)
          prerelease: true
          files: dropship-app/mobile/dropit-preview.apk
          body: |
            Android preview build of DropIt. It runs on **simulated data** (no server), so reviewers can try every screen.
            Install: download `dropit-preview.apk` on an Android phone, open it, and allow "install unknown apps" if asked.
            Built from commit ${{ github.sha }}.
